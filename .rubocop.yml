inherit_gem:
  rubocop-ubpb: ruby.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    # Contains a syntax error on purpose (loader tests).
    - "test/fixtures/jobs/broken.rb"

Style/FrozenStringLiteralComment:
  Enabled: true

# DSL steps such as `map { raise ... }` are not loops; tests and fixtures
# let steps raise on purpose.
Lint/UnreachableLoop:
  Exclude:
    - "test/**/*"
