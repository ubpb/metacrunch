name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.gem }}, Ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        gem: [metacrunch, metacrunch-csv, metacrunch-xlsx, metacrunch-marc, metacrunch-elasticsearch, metacrunch-db,
              metacrunch-redis]
        os: [ubuntu-latest, macos-latest]
        ruby: ["4.0", head]
    defaults:
      run:
        working-directory: ${{ matrix.gem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ matrix.gem }}
      - run: bundle exec rake test

  lint:
    name: Lint (${{ matrix.gem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem: [metacrunch, metacrunch-csv, metacrunch-xlsx, metacrunch-marc, metacrunch-elasticsearch, metacrunch-db,
              metacrunch-redis]
    defaults:
      run:
        working-directory: ${{ matrix.gem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ${{ matrix.gem }}
      - run: bundle exec rubocop

  # metacrunch-elasticsearch against a server: service containers exist on Linux only.
  elasticsearch:
    name: Elasticsearch (server ${{ matrix.server }}, client ${{ matrix.client }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {server: "8.19.23", client: "8", gemfile: gemfiles/elasticsearch_8.gemfile}
          - {server: "9.5.5", client: "9", gemfile: Gemfile}
          - {server: "9.5.5", client: "8", gemfile: gemfiles/elasticsearch_8.gemfile}
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.server }}
        env:
          discovery.type: single-node
          ELASTIC_PASSWORD: metacrunch
          xpack.security.enabled: "true"
          xpack.security.http.ssl.enabled: "false"
          cluster.routing.allocation.disk.threshold_enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs -u elastic:metacrunch 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/metacrunch-elasticsearch/${{ matrix.gemfile }}
      ELASTICSEARCH_URL: http://localhost:9200
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: metacrunch
    defaults:
      run:
        working-directory: metacrunch-elasticsearch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: metacrunch-elasticsearch
      - run: bundle exec rake test

  # metacrunch-db against PostgreSQL, MySQL and MariaDB: service containers exist on Linux only. The Gemfile has pg for
  # PostgreSQL, gemfiles/mysql.gemfile mysql2 and trilogy for MySQL and MariaDB; both run SQLite too.
  db:
    name: Databases (${{ matrix.gemfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gemfile: [Gemfile, gemfiles/mysql.gemfile]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: metacrunch
          POSTGRES_DB: metacrunch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: metacrunch
          MYSQL_DATABASE: metacrunch
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmetacrunch" --health-interval 2s --health-timeout 5s
          --health-retries 60
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: metacrunch
          MARIADB_DATABASE: metacrunch
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-timeout 5s
          --health-retries 60
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/metacrunch-db/${{ matrix.gemfile }}
      TEST_POSTGRES_URL: postgres://postgres:metacrunch@127.0.0.1:5432/metacrunch
      TEST_MYSQL_URL: mysql://root:metacrunch@127.0.0.1:3306/metacrunch
      TEST_MARIADB_URL: mysql://root:metacrunch@127.0.0.1:3307/metacrunch
    defaults:
      run:
        working-directory: metacrunch-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev
        if: matrix.gemfile == 'gemfiles/mysql.gemfile'
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: metacrunch-db
      - run: bundle exec rake test

  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake test:tooling rubocop:root
