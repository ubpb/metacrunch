server {
  listen 80;
  root /usr/share/nginx/html;
  # Relative Location headers: inside the container nginx does not know the published port.
  absolute_redirect off;

  # A page that moved.
  location = /old-loans {
    return 301 /handbook/loans.html;
  }

  # Pages in ISO-8859-1, as the header says.
  location /latin1/ {
    charset iso-8859-1;
  }
}
