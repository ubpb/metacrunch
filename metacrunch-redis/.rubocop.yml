inherit_gem:
  rubocop-ubpb: ruby.yml

inherit_mode:
  merge:
    - Exclude

Style/FrozenStringLiteralComment:
  Enabled: true

# Tests leave loops on purpose (`reader.each { break }`).
Lint/UnreachableLoop:
  Exclude:
    - "test/**/*"

# Key templates take %{field} on purpose (KeyTemplate); they are no format strings.
Style/FormatStringToken:
  Enabled: false
