# Parameter values of pseudonymize.rb per environment (see docs/jobs.md).
# Without -e the job takes the pepper from the credentials, its default:.
# A container gets its secrets as variables, so there the pepper comes from
# PSEUDONYM_PEPPER:
#
#   PSEUDONYM_PEPPER=... metacrunch run -e container --params examples/credentials/params.yml ...
container:
  pepper: {env: PSEUDONYM_PEPPER}
